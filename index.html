<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تقارير عقارات سوريا</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:#f7f7f8;color:#111;text-align:center;padding:24px}
    .card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:28px;max-width:560px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
    a{color:#155eef;font-weight:700}
  </style>
</head>
<body>
  <main class="card">
    <h1>تقارير عقارات سوريا</h1>
    <p>يتم تحميل لوحة إعلانات العقارات...</p>
    <p><a href="real_estate_ads.html">فتح الصفحة البديلة</a></p>
  </main>
  <script>
    fetch('real_estate_ads.html', { cache: 'no-cache' })
      .then(function (r) { return r.text(); })
      .then(function (html) {
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function () {
        document.querySelector('p').textContent = 'تعذر تحميل اللوحة تلقائياً.';
      });
  </script>
</body>
</html>
