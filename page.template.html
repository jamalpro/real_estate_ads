<style>
:root{
  --bg:#f7f7f8; --card:#fff; --text:#111; --muted:#666; --accent:#155eef;
  --border:#ddd; --good:#0b7a34; --good-bg:#ecfdf3; --good-border:#abefc6;
  --warn:#9a6700; --warn-bg:#fffaeb; --warn-border:#fedf89; --price:#0b4c9c;
  --header-h:150px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#16181c; --card:#1e2126; --text:#e9eaec; --muted:#9aa0a6; --accent:#4c8dff;
    --border:#333840; --good:#6ee7a8; --good-bg:#10291b; --good-border:#1f5236;
    --warn:#f5c451; --warn-bg:#2b2312; --warn-border:#5a4718; --price:#7fb2ff;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);z-index:10;padding:14px 18px}
h1{font-size:22px;margin:0 0 6px}
.meta{color:var(--muted);font-size:13px}
.controls{display:grid;grid-template-columns:2fr repeat(5,1fr);gap:8px;margin:14px 0}
.controls input,.controls select{padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font-size:14px;min-width:0}
.buttons{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
main{padding:18px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;min-width:130px}
.stat b{display:block;font-size:20px}
.stat span{font-size:12px;color:var(--muted)}
.note{margin:0 0 14px;padding:10px 12px;border-radius:10px;background:var(--warn-bg);border:1px solid var(--warn-border);color:var(--warn);font-size:13px}
.empty{text-align:center;color:var(--muted);padding:48px 0;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h3{font-size:16px;margin:0 0 8px;line-height:1.4}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.badges:empty{display:none}
.badge{font-size:12px;border:1px solid var(--border);border-radius:999px;padding:3px 8px;background:var(--bg)}
.badge.score{background:var(--good-bg);color:var(--good);border-color:var(--good-border)}
.badge.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-border)}
.price{font-weight:700;color:var(--price);font-size:15px}
.muted,.small{color:var(--muted)}
.small{font-size:12px}
.raw{white-space:pre-wrap;max-height:190px;overflow:auto;border-top:1px dashed var(--border);padding-top:8px;margin-top:8px;font-size:13px;line-height:1.55}
table{width:100%;border-collapse:collapse;background:var(--card)}
th,td{border-bottom:1px solid var(--border);padding:8px;text-align:right;vertical-align:top}
th{position:sticky;top:calc(var(--header-h) - 1px);background:var(--card);z-index:5}
#tableWrap{overflow:auto;border:1px solid var(--border);border-radius:12px}
.ltr{direction:ltr;text-align:left}
.num{direction:ltr;display:inline-block}
[hidden]{display:none !important}
@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header id="topbar">
  <h1>تقرير عقارات دمشق</h1>
  <div class="meta" id="meta"></div>
  <div class="controls">
    <input id="q" type="search" placeholder="بحث: المالكي، طابو، مستودع، 300 الف..." aria-label="بحث">
    <select id="trx" aria-label="العملية"><option value="">كل العمليات</option></select>
    <select id="cat" aria-label="نوع العقار"><option value="">كل الأنواع</option></select>
    <select id="area" aria-label="المنطقة"><option value="">كل المناطق</option></select>
    <input id="maxPrice" type="number" min="0" step="1000" placeholder="أقصى سعر $" aria-label="أقصى سعر بالدولار">
    <select id="sort" aria-label="الترتيب">
      <option value="date_desc">الأحدث</option>
      <option value="score_desc">أعلى تقييم</option>
      <option value="price_asc">الأرخص</option>
      <option value="ppm_asc">أقل $/م² (بيع)</option>
      <option value="size_desc">الأكبر مساحة</option>
    </select>
  </div>
  <div class="buttons">
    <button class="btn" id="btnReset" type="button">مسح الفلاتر</button>
    <button class="btn" id="btnView" type="button">عرض كجدول</button>
  </div>
</header>

<main>
  <section class="stats" id="stats"></section>
  <p class="note" id="note" hidden></p>
  <section class="grid" id="cards"></section>
  <div id="tableWrap" hidden>
    <table>
      <thead><tr>
        <th>التاريخ</th><th>المنطقة</th><th>النوع</th><th>عملية</th>
        <th>السعر</th><th>المساحة</th><th>$/م²</th><th>الطابق</th><th>التقييم</th><th>النص</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <p class="empty" id="empty" hidden>لا توجد نتائج مطابقة. جرّب توسيع الفلاتر.</p>
</main>

<script id="ads-data" type="application/json">{{ADS_JSON}}</script>
<script>
(function () {
  'use strict';

  var DB = JSON.parse(document.getElementById('ads-data').textContent);
  var ADS = Array.isArray(DB.ads) ? DB.ads : [];
  var $ = function (id) { return document.getElementById(id); };

  var AR_MARKS = /[ؐ-ًؚ-ٰٟـ]/g;
  var AR_DIGITS = /[٠-٩۰-۹]/g;

  function norm(value) {
    return String(value == null ? '' : value)
      .replace(AR_MARKS, '')
      .replace(/[أإآٱ]/g, 'ا')
      .replace(/ى/g, 'ي')
      .replace(/ؤ/g, 'و')
      .replace(/ئ/g, 'ي')
      .replace(/ة/g, 'ه')
      .replace(AR_DIGITS, function (d) {
        var code = d.charCodeAt(0);
        return String(code >= 0x06F0 ? code - 0x06F0 : code - 0x0660);
      })
      .toLowerCase()
      .replace(/\s+/g, ' ')
      .trim();
  }

  var ESCAPES = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (c) { return ESCAPES[c]; });
  }

  var nf = new Intl.NumberFormat('en-US');
  function fmt(n) { return (n == null || n === '') ? '' : nf.format(Number(n)); }

  // Searchable text per ad, normalized once so Arabic spelling variants and
  // Arabic-Indic digits still match what the user types.
  var HAY = new Map();
  ADS.forEach(function (a) {
    HAY.set(a, norm([
      a.raw_text, a.area, a.area_group, a.category, a.category_group,
      a.transaction, a.price_text, a.floor, (a.tags || []).join(' ')
    ].join(' ')));
  });

  function options(values) {
    return Array.from(new Set(values.filter(Boolean)))
      .sort(function (a, b) { return a.localeCompare(b, 'ar'); });
  }

  function readFilters() {
    return {
      terms: norm($('q').value).split(' ').filter(Boolean),
      trx: $('trx').value,
      cat: $('cat').value,
      area: $('area').value,
      max: Number($('maxPrice').value) || 0,
      sort: $('sort').value
    };
  }

  function matches(a, f) {
    if (f.trx && a.transaction_group !== f.trx) return false;
    if (f.cat && a.category_group !== f.cat) return false;
    if (f.area && a.area_group !== f.area) return false;
    if (f.max && !(a.price_usd != null && a.price_usd <= f.max)) return false;
    if (f.terms.length) {
      var hay = HAY.get(a) || '';
      for (var i = 0; i < f.terms.length; i++) {
        if (hay.indexOf(f.terms[i]) === -1) return false;
      }
    }
    return true;
  }

  // Ads missing the sort field always sink to the bottom, whichever direction.
  function byNumber(get, dir) {
    return function (x, y) {
      var a = get(x), b = get(y);
      if (a == null && b == null) return 0;
      if (a == null) return 1;
      if (b == null) return -1;
      return dir * (a - b);
    };
  }

  var SORTS = {
    date_desc: function (x, y) { return String(y.date_iso || '').localeCompare(String(x.date_iso || '')); },
    score_desc: byNumber(function (a) { return a.score; }, -1),
    price_asc: byNumber(function (a) { return a.price_usd; }, 1),
    ppm_asc: byNumber(function (a) { return a.price_per_m2; }, 1),
    size_desc: byNumber(function (a) { return a.size_m2; }, -1)
  };

  function median(nums) {
    if (!nums.length) return null;
    var s = nums.slice().sort(function (a, b) { return a - b; });
    var m = s.length >> 1;
    return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
  }

  function currencyLabel(a) {
    if (a.currency_norm === 'USD') return '$';
    if (a.currency_norm === 'SYP?') return 'ل.س (غير مؤكد)';
    return a.currency || '';
  }

  function priceHtml(a) {
    if (a.price == null) {
      return '<span class="muted">' + esc(a.price_text || 'السعر غير مذكور') + '</span>';
    }
    return '<span class="num">' + fmt(a.price) + '</span> ' + esc(currencyLabel(a));
  }

  function badge(text, cls) {
    return text ? '<span class="badge' + (cls ? ' ' + cls : '') + '">' + esc(text) + '</span>' : '';
  }

  function cardHtml(a) {
    var title = [a.area || 'منطقة غير محددة', a.category || 'عقار', a.transaction].filter(Boolean).join(' — ');
    var size = a.size_m2 ? fmt(a.size_m2) + ' م²' : (a.land_dunum ? fmt(a.land_dunum) + ' دونم' : 'غير محددة');
    var ppm = a.price_per_m2 ? ' | ' + fmt(a.price_per_m2) + ' $/م²' : '';
    return '<article class="card">' +
      '<h3>' + esc(title) + '</h3>' +
      '<div class="badges">' +
        badge('تقييم ' + (a.score == null ? 0 : a.score) + '/10', 'score') +
        badge(a.transaction) + badge(a.floor) + (a.has_photos ? badge('صور/فيديو') : '') +
      '</div>' +
      '<div class="small">' + esc(a.stamp_raw || a.date || '') + '</div>' +
      '<div class="price">' + priceHtml(a) + '</div>' +
      '<div>المساحة: ' + esc(size) + esc(ppm) + '</div>' +
      '<div class="badges">' + (a.tags || []).slice(0, 8).map(function (t) { return badge(t, 'warn'); }).join('') + '</div>' +
      '<div class="raw">' + esc(a.raw_text || '') + '</div>' +
    '</article>';
  }

  function rowHtml(a) {
    return '<tr>' +
      '<td class="ltr">' + esc(a.date || '') + '</td>' +
      '<td>' + esc(a.area || '') + '</td>' +
      '<td>' + esc(a.category || '') + '</td>' +
      '<td>' + esc(a.transaction || '') + '</td>' +
      '<td class="ltr">' + (a.price == null ? '' : fmt(a.price) + ' ' + esc(currencyLabel(a))) + '</td>' +
      '<td class="ltr">' + fmt(a.size_m2) + '</td>' +
      '<td class="ltr">' + fmt(a.price_per_m2) + '</td>' +
      '<td>' + esc(a.floor || '') + '</td>' +
      '<td class="ltr">' + esc(a.score == null ? '' : a.score) + '</td>' +
      '<td><div class="raw">' + esc(a.raw_text || '') + '</div></td>' +
    '</tr>';
  }

  function statHtml(value, label) {
    return '<div class="stat"><b>' + esc(value) + '</b><span>' + esc(label) + '</span></div>';
  }

  var results = [];
  var tableMode = false;

  function render() {
    var f = readFilters();
    results = ADS.filter(function (a) { return matches(a, f); }).sort(SORTS[f.sort] || SORTS.date_desc);

    var forSale = results.filter(function (a) { return (a.transaction_group || '').indexOf('بيع') === 0; }).length;
    var forRent = results.filter(function (a) { return (a.transaction_group || '').indexOf('إيجار') !== -1; }).length;
    var med = median(results.map(function (a) { return a.price_per_m2; }).filter(function (v) { return v != null; }));
    $('stats').innerHTML =
      statHtml(fmt(results.length), 'نتائج الفلترة') +
      statHtml(fmt(ADS.length), 'إجمالي القاعدة') +
      statHtml(fmt(forSale), 'للبيع') +
      statHtml(fmt(forRent), 'للإيجار') +
      statHtml(med == null ? '—' : fmt(Math.round(med)), 'وسيط $/م² (بيع)');

    var note = $('note');
    if (f.max) {
      var hidden = ADS.filter(function (a) { return a.price_usd == null; }).length;
      note.textContent = 'فلتر السعر يشمل الإعلانات المسعّرة بالدولار فقط، وبالتالي ' + hidden + ' إعلاناً بدون سعر بالدولار مستبعد حالياً.';
      note.hidden = false;
    } else {
      note.hidden = true;
    }

    $('empty').hidden = results.length > 0;
    $('cards').hidden = tableMode || results.length === 0;
    $('tableWrap').hidden = !tableMode || results.length === 0;
    if (!tableMode) {
      $('cards').innerHTML = results.map(cardHtml).join('');
      $('tbody').innerHTML = '';
    } else {
      $('tbody').innerHTML = results.map(rowHtml).join('');
      $('cards').innerHTML = '';
    }
  }

  function resetFilters() {
    ['q', 'maxPrice', 'trx', 'cat', 'area'].forEach(function (id) { $(id).value = ''; });
    $('sort').value = 'date_desc';
    render();
  }

  function syncHeaderHeight() {
    document.documentElement.style.setProperty('--header-h', $('topbar').offsetHeight + 'px');
  }

  function init() {
    var meta = DB.metadata || {};
    var added = meta.last_append && meta.last_append.added_records;
    $('meta').textContent = ADS.length + ' إعلان | آخر تحديث: ' + (meta.last_updated || '—') +
      (added ? ' | آخر إضافة: ' + added + ' سجل جديد' : '');

    [['trx', 'transaction_group'], ['cat', 'category_group'], ['area', 'area_group']].forEach(function (pair) {
      var select = $(pair[0]);
      options(ADS.map(function (a) { return a[pair[1]]; })).forEach(function (value) {
        select.appendChild(new Option(value, value));
      });
    });

    var timer;
    ['q', 'maxPrice'].forEach(function (id) {
      $(id).addEventListener('input', function () {
        clearTimeout(timer);
        timer = setTimeout(render, 120);
      });
    });
    ['trx', 'cat', 'area', 'sort'].forEach(function (id) {
      $(id).addEventListener('change', render);
    });
    $('btnReset').addEventListener('click', resetFilters);
    $('btnView').addEventListener('click', function () {
      tableMode = !tableMode;
      this.textContent = tableMode ? 'عرض كبطاقات' : 'عرض كجدول';
      render();
    });

    syncHeaderHeight();
    window.addEventListener('resize', syncHeaderHeight);
    render();
  }

  init();
}());
</script>
</body>
</html>
