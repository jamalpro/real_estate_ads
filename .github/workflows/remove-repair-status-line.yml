name: Remove repair status line

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove repair-status notice
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r"\s*notes\.push\('تم إصلاح '\+repairStats\.price\+' سعر، '\+repairStats\.area\+' منطقة، '\+repairStats\.size\+' مساحة، وتطبيق '\+repairStats\.corrections\+' تصحيح يدوي\.'\);?")
          for name in ['page.template.html', 'index.html', 'real_estate_ads.html']:
              p = Path(name)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')
              ns = pattern.sub('', s)
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
          PY
      - name: Commit removal
        run: |
          rm -f .github/workflows/remove-repair-status-line.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair status line found."
            exit 0
          fi
          git commit -m "Remove repair status notice from dashboard"
          git push
