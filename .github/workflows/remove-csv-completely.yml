name: Remove CSV completely

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-csv:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'github-actions[bot]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove CSV files and logic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          def strip_csv_ui(text: str) -> str:
              text = re.sub(r'\n\s*<button class="btn primary" id="btnCsv" type="button">[^<]*</button>', '', text)
              text = re.sub(r'\n\s*function downloadCSV\(\) \{[\s\S]*?\n\s*\}\n\n\s*function resetFilters\(\)', '\n\n  function resetFilters()', text)
              text = re.sub(r"\n\s*\$\('btnCsv'\)\.addEventListener\('click', downloadCSV\);", '', text)
              return text

          # build.py: JSON is source of truth; no CSV generation.
          p = root / 'build.py'
          s = p.read_text(encoding='utf-8')
          s = s.replace('"""Regenerate real_estate_ads.csv and dashboard HTML files from real_estate_ads.json.\n\nreal_estate_ads.json is the source of truth. This script recomputes the derived\nfields on each ad, validates the dataset, and writes the spreadsheet export plus\nboth dashboard entry points:\n\n- real_estate_ads.html for the explicit dashboard URL\n- index.html for the GitHub Pages project root URL\n\nRun it after any change to the JSON or to page.template.html.\n"""', '"""Regenerate dashboard HTML files from real_estate_ads.json.\n\nreal_estate_ads.json is the single source of truth. This script recomputes\nderived fields, validates the dataset, and writes both dashboard entry points:\n\n- real_estate_ads.html for the explicit dashboard URL\n- index.html for the GitHub Pages project root URL\n\nRun it after any change to the JSON or to page.template.html.\n"""')
          s = s.replace('import csv\n', '')
          s = s.replace('CSV_PATH = ROOT / "real_estate_ads.csv"\n', '')
          s = re.sub(r'\nCSV_COLUMNS = \[[\s\S]*?\n\]\n\nAR_MARKS =', '\nAR_MARKS =', s)
          s = re.sub(r'\n\ndef write_csv\(ads\):[\s\S]*?\n\ndef write_html\(db\):', '\n\ndef write_html(db):', s)
          s = s.replace('    write_csv(ads)\n', '')
          s = s.replace('    print(f"{len(ads)} ads -> {CSV_PATH.name}, {HTML_PATH.name}, {INDEX_PATH.name}")', '    print(f"{len(ads)} ads -> {HTML_PATH.name}, {INDEX_PATH.name}")')
          p.write_text(s, encoding='utf-8')

          # Dashboard template and generated HTML: remove CSV export button and browser-side code.
          for name in ['page.template.html', 'index.html', 'real_estate_ads.html']:
              p = root / name
              if p.exists():
                  p.write_text(strip_csv_ui(p.read_text(encoding='utf-8')), encoding='utf-8')

          # smoke_test.js: remove CSV export checks/stubs.
          p = root / 'smoke_test.js'
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace('filters/sorts/export behave.', 'filters/sorts behave.')
              s = s.replace('let downloaded = null;\n', '')
              s = re.sub(r"\n\s*createElement: \(\) => \(\{ click\(\) \{ downloaded = this.href; \}, set href\(v\) \{ this\._h = v; \}, get href\(\) \{ return this\._h; \} \}\)", "\n    createElement: () => ({})", s)
              s = re.sub(r",\n\s*Blob: function \(parts\) \{ this\.text = parts\.join\(''\); sandbox\.__lastBlob = this; \},\n\s*URL: \{ createObjectURL: \(\) => 'blob:test', revokeObjectURL\(\) \{\} \}", '', s)
              s = re.sub(r"\n\s*\$\('btnCsv'\)\.fire\('click'\);[\s\S]*?check\('csv export has one row per result', csv\.split\('\\\\r\\\\n'\)\.length >= 2\);\n", '\n', s)
              p.write_text(s, encoding='utf-8')

          # README: remove CSV as a tracked/required artifact.
          p = root / 'README.md'
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = s.replace('- `real_estate_ads.csv` - spreadsheet-friendly export.\n', '')
              s = s.replace('table mode, and CSV export.', 'table mode.')
              s = re.sub(r'The current dataset contains \d+ ad records in `real_estate_ads.json`\.', 'The current dataset is stored only in `real_estate_ads.json`.', s)
              s = s.replace('Commit and push the changed `real_estate_ads.json`, `real_estate_ads.csv`, `real_estate_ads.html`, and `index.html` files.', 'Commit and push the changed `real_estate_ads.json`, `real_estate_ads.html`, and `index.html` files.')
              p.write_text(s, encoding='utf-8')

          # Remove tracked CSV and temporary CSV workflow if present.
          for name in ['real_estate_ads.csv', '.github/workflows/regenerate-csv-once.yml']:
              path = root / name
              if path.exists():
                  path.unlink()
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/remove-csv-completely.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No CSV cleanup changes."
            exit 0
          fi
          git commit -m "Remove CSV export and generated CSV file"
          git push
