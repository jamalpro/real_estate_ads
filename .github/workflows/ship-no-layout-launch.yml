name: Ship launch changes without layout change

on:
  push:
    branches:
      - launch-phase-1-3-no-layout-change
    paths:
      - .github/workflows/ship-no-layout-launch.yml
      - .github/workflows/ship_no_layout_launch.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch-phase-1-3-no-layout-change
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply no-layout launch patch
        run: python3 .github/workflows/ship_no_layout_launch.py
      - name: Commit launch changes
        run: |
          rm -f .github/workflows/ship-no-layout-launch.yml .github/workflows/ship_no_layout_launch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add page.template.html index.html real_estate_ads.html smoke_test.js robots.txt sitemap.xml LAUNCH_NOTES.md .github/workflows/ship-no-layout-launch.yml .github/workflows/ship_no_layout_launch.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Ship public launch metadata without layout changes"
            git pull --rebase origin launch-phase-1-3-no-layout-change
            git push origin HEAD:launch-phase-1-3-no-layout-change
          fi
